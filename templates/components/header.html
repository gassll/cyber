{% load static %}

<header class="header">
    <div class="header-container">

        <!-- BURGER -->
        <button class="burger" id="burger">
            ☰
        </button>

        <!-- LOGO -->
        <a href="/" class="logo">
            <img src="{% static 'icons/logo.svg' %}" class="logo-img" alt="logo">
        </a>

        <!-- NAV -->
        <nav class="nav">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Главная</a>

            <a href="/news/" class="{% if '/news/' in request.path %}active{% endif %}">Новости</a>

            <a href="/booking/" class="{% if '/booking/' in request.path %}active{% endif %}">Бронирование</a>

            <a href="/career/" class="{% if '/career/' in request.path %}active{% endif %}">Карьера</a>

            <a href="/contacts/" class="{% if '/contacts/' in request.path %}active{% endif %}">Контакты</a>
        </nav>

        <!-- ACTIONS -->
        <div class="actions">
            <a class="book" href="#">Забронировать</a>

            {% if request.user.is_authenticated %}
                <a class="login" href="{% url 'account' %}">Кабинет</a>
            {% else %}
                <a class="login" href="{% url 'login' %}">Войти</a>
            {% endif %}
        </div>

    </div>

    <!-- MOBILE MENU -->
    <nav class="mobile-menu" id="mobileMenu">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Главная</a>
        <a href="/news/" class="{% if '/news/' in request.path %}active{% endif %}">Новости</a>
        <a href="/booking/" class="{% if '/booking/' in request.path %}active{% endif %}">Бронирование</a>
        <a href="/career/" class="{% if '/career/' in request.path %}active{% endif %}">Карьера</a>
        <a href="/contacts/" class="{% if '/contacts/' in request.path %}active{% endif %}">Контакты</a>

        {% if request.user.is_authenticated %}
            <a href="{% url 'account' %}">Кабинет</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
        {% endif %}
    </nav>
</header>
