{% extends "base.html" %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h2 class="auth-title">Создание аккаунта</h2>
        <p class="auth-subtitle">Присоединяйся к CyberX </p>

        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Логин" required>
            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password1" placeholder="Пароль" required>
            <input type="password" name="password2" placeholder="Повтор пароля" required>

            <button type="submit">Создать аккаунт</button>
        </form>

        <p class="auth-switch">
            Уже есть аккаунт?
            <a href="{% url 'login' %}">Войти</a>
        </p>

    </div>

</div>

{% endblock %}
